# Fine-tune on Kaggle without anyone at a browser.
#
# Kaggle gives 30 GPU-hours a week free, 9-hour sessions, and root -- which
# matters more than the GPU, because GRPO's reward is a render and training
# and verification have to live in the same machine.
#
# The loop: package the mix -> upload it as a Kaggle dataset -> push the
# kernel -> poll until it finishes -> pull the output. The adapter publishes
# itself to Hugging Face from inside the notebook, so no step here depends
# on a human downloading a file.
#
# Requires secrets KAGGLE_USERNAME, KAGGLE_KEY, HF_TOKEN (docs/SETUP.md C2).
name: train

on:
  workflow_dispatch:
    inputs:
      note:
        description: "What is the one variable that changed in this run?"
        required: true
        type: string
      smoke:
        description: "Smoke run: 20 steps on 64 rows, ~8 min. Proves the path."
        required: false
        default: false
        type: boolean

jobs:
  sft:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # a 9-hour Kaggle session, plus slack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q kaggle huggingface-hub
          python -m pip install -q -e .

      - name: restore the corpus
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/backup_to_hf.py --restore

      # Rebuild rather than trust what was restored. The mix is cheap to
      # derive and expensive to get wrong, and its hash is recorded with the
      # eval numbers so a result can always be traced to the data that
      # produced it.
      - name: rebuild the training mix
        run: |
          python scripts/export_gold.py
          python scripts/export_dataset.py
          python scripts/prepare_training.py
          python -m forge.doctor || true

      # Kaggle CLI 2.2.x dropped the username+key kaggle.json for a single
      # bearer token. KAGGLE_API_TOKEN is read directly, so there is no file
      # to write and no username to supply -- it comes back from the API.
      - name: check credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || {
            echo "KAGGLE_API_TOKEN secret is not set — see docs/SETUP.md C2"; exit 1; }
          kaggle kernels list --mine >/dev/null
          echo "authenticated as $(python -c "
          from kaggle.api.kaggle_api_extended import KaggleApi
          a=KaggleApi(); a.authenticate(); print(a.get_config_value('username'))")"

      # After authentication, so the metadata files carry the account that
      # actually owns the token rather than one hard-coded in the repo.
      - name: package for Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python scripts/package_for_kaggle.py

      # Upload only when the mix has actually changed, and prove the new
      # version is being served before attaching a kernel to it. Run 5
      # uploaded, "waited" one second on a status that still described the
      # previous version, and got a kernel with no dataset mounted at all.
      - name: sync the dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python scripts/sync_kaggle_dataset.py kaggle/manim-forge-data \
            --ref nimbou/manim-forge-data --expect train.jsonl valid.jsonl

      # A Kaggle kernel sees none of this environment, so the flag has to go
      # into the file before it is pushed.
      - name: select smoke or full run
        run: |
          if [ "${{ inputs.smoke }}" = "true" ]; then
            sed -i 's/^SMOKE = False  # workflow-managed/SMOKE = True  # workflow-managed/' kaggle/01_sft.py
            grep -n '^SMOKE' kaggle/01_sft.py
            python -c "import ast;ast.parse(open('kaggle/01_sft.py').read())"
          fi
          grep -c '^SMOKE = ' kaggle/01_sft.py

      - name: push the kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p kaggle/

      # Kaggle has no webhook, so this polls. Ten minutes between checks: the
      # job takes hours and a tighter loop only burns runner minutes.
      # Kaggle has no webhook, so this polls. Ten minutes between checks:
      # the job runs for hours and a tighter loop only burns runner minutes.
      #
      # The classification is tested in tests/test_kaggle_poll.py against all
      # seven KernelWorkerStatus values and against the two ways this went
      # wrong before: a case-sensitive match that could not see ERROR, and a
      # substring match over the whole message, which includes the kernel's
      # own slug.
      - name: wait for it
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USER: nimbou
        run: |
          unparsed=0
          interval=600; [ "${{ inputs.smoke }}" = "true" ] && interval=60
          for i in $(seq 1 54); do
            sleep "$interval"
            raw=$(kaggle kernels status "$KAGGLE_USER/manim-forge-sft" 2>&1 || true)
            token=$(printf '%s' "$raw" \
              | sed -n 's/.*KernelWorkerStatus\.\([A-Z_]*\).*/\1/p')
            echo "[$i] ${token:-unparsed}  ($raw)"
            case "${token:-}" in
              COMPLETE)
                echo "kernel finished"; exit 0 ;;
              ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)
                echo "::error::kernel ended as $token"
                kaggle kernels output "$KAGGLE_USER/manim-forge-sft" -p out/ || true
                python scripts/read_kaggle_log.py out/ || true
                exit 1 ;;
              QUEUED|RUNNING|NEW_SCRIPT)
                unparsed=0 ;;
              *)
                # A transient CLI or network failure is not a verdict on the
                # kernel; several in a row is a verdict on the poller.
                unparsed=$((unparsed + 1))
                if [ "$unparsed" -ge 5 ]; then
                  echo "::error::5 consecutive unreadable statuses"; exit 1
                fi ;;
            esac
          done
          echo "::error::still running after 9 hours — check Kaggle"; exit 1

      - name: pull the output
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USER: nimbou
        run: |
          kaggle kernels output "$KAGGLE_USER/manim-forge-sft" -p out/ || true
          python scripts/read_kaggle_log.py out/ || true

      # The kernel cannot push this itself: a Kaggle notebook sees none of
      # the runner's environment, so HF_TOKEN would have to be attached as a
      # Kaggle Secret through the web UI -- a manual step in a loop whose
      # point is having none. This refuses to publish an adapter with no
      # weights rather than reporting a successful upload of nothing.
      - name: publish the adapter
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_adapter.py out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-output
          path: out/
