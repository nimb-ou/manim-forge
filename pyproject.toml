[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-forge"
version = "0.1.0"
description = "Local LLM that generates 3Blue1Brown-style Manim animations from plain English"
requires-python = ">=3.11"
license = "CC-BY-NC-SA-4.0"

[tool.setuptools.packages.find]
include = ["forge*"]
