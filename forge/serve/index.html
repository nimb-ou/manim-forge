<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manim Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f4f5f7; --surface: #ffffff; --ink: #1b1e24; --muted: #5d6470;
  --line: #d9dde3; --accent: #1f7fa3; --accent-soft: #e2f1f7;
  --warn: #9a6a00; --warn-soft: #fbf1d9; --bad: #b3261e; --good: #2f7d32;
  --code-bg: #f0f2f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1014; --surface: #161a20; --ink: #e6e4df; --muted: #8f96a3;
    --line: #262b34; --accent: #58c4dd; --accent-soft: #14303a;
    --warn: #f4d35e; --warn-soft: #2e2912; --bad: #ff8a80; --good: #8bd48f;
    --code-bg: #0b0d11;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1014; --surface: #161a20; --ink: #e6e4df; --muted: #8f96a3;
  --line: #262b34; --accent: #58c4dd; --accent-soft: #14303a;
  --warn: #f4d35e; --warn-soft: #2e2912; --bad: #ff8a80; --good: #8bd48f;
  --code-bg: #0b0d11;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif;
  padding-inline: 16px;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 {
  font: 600 30px/1.1 "Source Serif 4", Georgia, serif; margin: 0;
  letter-spacing: -0.01em;
}
.tag { color: var(--muted); font-size: 14px; }
.health { margin-left: auto; font: 12px "IBM Plex Mono", monospace; color: var(--muted); }

form {
  margin-top: 22px; display: grid; gap: 12px;
  grid-template-columns: 1fr auto; align-items: start;
}
textarea {
  width: 100%; min-height: 64px; resize: vertical; padding: 12px 14px;
  font: 16px/1.45 "IBM Plex Sans", sans-serif; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
textarea:focus-visible, button:focus-visible, select:focus-visible,
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls { display: flex; flex-direction: column; gap: 8px; min-width: 190px; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
label { font-size: 13px; color: var(--muted); }
select, input[type=number] {
  font: 14px "IBM Plex Sans", sans-serif; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; width: 92px;
}
button {
  font: 500 15px "IBM Plex Sans", sans-serif; cursor: pointer;
  background: var(--accent); color: var(--ground); border: 0; border-radius: 8px;
  padding: 10px 16px;
}
button:disabled { opacity: .5; cursor: progress; }
.examples { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.examples button {
  background: transparent; color: var(--accent); border: 1px solid var(--line);
  font-size: 13px; padding: 5px 10px;
}

.stages { display: flex; gap: 6px; margin-top: 22px; flex-wrap: wrap; }
.stage {
  font: 12px "IBM Plex Mono", monospace; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted);
}
.stage.active { border-color: var(--accent); color: var(--accent); }
.stage.done { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.stage.fail { color: var(--bad); border-color: var(--bad); }

main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; margin-top: 18px; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } form { grid-template-columns: 1fr; } }
section h2 {
  font: 600 13px "IBM Plex Sans", sans-serif; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); margin: 0 0 10px;
}
.beats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.beat {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px;
}
.beat .head { display: flex; gap: 10px; align-items: baseline; }
.beat .n { font: 500 13px "IBM Plex Mono", monospace; color: var(--accent); min-width: 22px; }
.beat .intent { font-weight: 500; }
.beat .secs { margin-left: auto; font: 12px "IBM Plex Mono", monospace; color: var(--muted); }
.beat .narr { color: var(--muted); font-size: 14px; margin: 4px 0 0 32px; }
.beat pre {
  margin: 8px 0 0; padding: 8px 10px; background: var(--code-bg); border-radius: 6px;
  font: 12.5px/1.5 "IBM Plex Mono", monospace; overflow-x: auto; max-height: 260px;
}
.beat .note { margin: 6px 0 0 32px; font-size: 13px; color: var(--warn); }
.beat.dropped { opacity: .55; }
.beat.writing { border-color: var(--accent); }

.player {
  background: #000; border-radius: 10px; aspect-ratio: 16 / 9; width: 100%;
  display: grid; place-items: center; color: #8f96a3; overflow: hidden;
  font: 13px "IBM Plex Mono", monospace; text-align: center; padding: 12px;
}
.player video { width: 100%; height: 100%; }
.log { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.log .item { font-size: 13px; padding: 6px 10px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.log .item.bad { background: transparent; border: 1px solid var(--bad); color: var(--bad); white-space: pre-wrap; font-family: "IBM Plex Mono", monospace; }
details { margin-top: 12px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details pre {
  background: var(--code-bg); padding: 10px; border-radius: 6px; max-height: 420px; overflow: auto;
  font: 12px/1.5 "IBM Plex Mono", monospace;
}
.meta { font: 12px "IBM Plex Mono", monospace; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .beat { animation: in .25s ease-out; } }
@keyframes in { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Manim Forge</h1>
    <span class="tag">a request in plain English, planned, coded and rendered on this Mac</span>
    <span class="health" id="health">…</span>
  </header>

  <form id="form">
    <textarea id="prompt" required placeholder="e.g. why the area of a circle is pi r squared"></textarea>
    <div class="controls">
      <div class="row"><label for="beats">beats</label><input id="beats" type="number" min="2" max="24" value="8"></div>
      <div class="row"><label for="quality">quality</label>
        <select id="quality"><option value="low">low · fast</option><option value="medium" selected>medium</option><option value="high">high</option></select></div>
      <div class="row"><label for="kit">visual kit</label><select id="kit"><option value="1" selected>on</option><option value="0">off (raw Manim)</option></select></div>
      <button id="go" type="submit">Make the animation</button>
    </div>
    <div class="examples" id="examples"></div>
  </form>

  <div class="stages" id="stages"></div>

  <main>
    <section>
      <h2>Plan and code</h2>
      <ol class="beats" id="beats-list"></ol>
    </section>
    <section>
      <h2>Animation</h2>
      <div class="player" id="player">Nothing yet — write a request and press the button.</div>
      <div class="meta" id="meta"></div>
      <div class="log" id="log"></div>
      <details id="codebox" hidden><summary>The assembled scene</summary><pre id="fullcode"></pre></details>
    </section>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const STAGES = ["queued", "loading", "plan", "code", "assemble", "render", "done"];
const EXAMPLES = [
  "why the area of a circle is pi r squared",
  "what a matrix does to the plane",
  "the derivative as the slope of a tangent line",
  "why the sum of 1/n^2 converges",
];
EXAMPLES.forEach((e) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = e;
  b.onclick = () => { $("prompt").value = e; $("prompt").focus(); };
  $("examples").append(b);
});

function stagePills(active, failed) {
  $("stages").innerHTML = "";
  const i = STAGES.indexOf(active);
  STAGES.forEach((s, k) => {
    const el = document.createElement("span");
    el.className = "stage" + (k < i ? " done" : k === i ? (failed ? " fail" : " active") : "");
    el.textContent = s;
    $("stages").append(el);
  });
}

function beatEl(n) { return document.querySelector(`.beat[data-n="${n}"]`); }
function esc(s) { return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function note(text, bad) {
  const d = document.createElement("div");
  d.className = "item" + (bad ? " bad" : ""); d.textContent = text; $("log").append(d);
}

async function health() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("health").textContent = `${h.planner} + ${h.coder} · ${h.model_loaded ? "model loaded" : "model loads on first run"}${h.queued ? " · " + h.queued + " queued" : ""}`;
  } catch { $("health").textContent = "server not reachable"; }
}
health(); setInterval(health, 10000);

$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  $("go").disabled = true; $("beats-list").innerHTML = ""; $("log").innerHTML = "";
  $("meta").textContent = ""; $("codebox").hidden = true;
  $("player").textContent = "Working…";
  const body = { prompt: $("prompt").value.trim(), beats: +$("beats").value,
                 quality: $("quality").value, kit: $("kit").value === "1" };
  const r = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { note(await r.text(), true); $("go").disabled = false; return; }
  const { id } = await r.json();
  const es = new EventSource(`/api/jobs/${id}/events`);
  let current = "queued"; stagePills(current);
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.stage !== current && STAGES.includes(e.stage)) { current = e.stage; stagePills(current); }
    if (e.stage === "queued" && e.position) $("player").textContent = `Queued behind ${e.position} job(s)…`;
    if (e.stage === "loading") $("player").textContent = e.note;
    if (e.stage === "plan" && e.beat) {
      const b = e.beat, li = document.createElement("li");
      li.className = "beat"; li.dataset.n = b.n;
      li.innerHTML = `<div class="head"><span class="n">${b.n}</span><span class="intent">${esc(b.intent)}</span><span class="secs">${b.seconds ? b.seconds + " s" : ""}</span></div>` +
        (b.narration ? `<div class="narr">${esc(b.narration)}</div>` : "");
      $("beats-list").append(li);
      $("player").textContent = `Planning… ${b.n} beat${b.n > 1 ? "s" : ""}`;
    }
    if (e.stage === "code" && e.status === "start") {
      const first = beatEl(1); if (first) first.classList.add("writing");
      $("player").textContent = "Writing the code, beat by beat…";
    }
    if (e.stage === "code" && e.beat) {
      const el = beatEl(e.beat);
      if (el) {
        el.classList.remove("writing");
        if (e.code) el.insertAdjacentHTML("beforeend", `<pre>${esc(e.code)}</pre>`);
        else el.classList.add("dropped");
        if (e.note) el.insertAdjacentHTML("beforeend", `<div class="note">${esc(e.note)}</div>`);
        const next = beatEl(e.beat + 1); if (next) next.classList.add("writing");
      }
    }
    if (e.stage === "assemble" && e.note) note(e.note);
    if (e.stage === "assemble" && e.status === "done") $("player").textContent = `Rendering ${e.kept} of ${e.of} beats…`;
    if (e.stage === "render" && e.note) note(e.note);
    if (e.code) { $("fullcode").textContent = e.code; $("codebox").hidden = false; }
    if (e.stage === "done") {
      es.close(); $("go").disabled = false;
      if (e.ok) {
        stagePills("done");
        $("player").innerHTML = `<video controls autoplay src="/api/jobs/${id}/video"></video>`;
        $("meta").textContent = `${(e.duration || 0).toFixed(1)} s of animation · made in ${e.elapsed} s`;
      } else {
        stagePills(current, true);
        $("player").textContent = "No video this time.";
        note(`Failed: ${e.error || "unknown"}` + (e.stderr ? "\n" + e.stderr.slice(-800) : "") + (e.trace ? "\n" + e.trace : ""), true);
      }
    }
  };
  es.onerror = () => { note("Lost the connection to the server.", true); es.close(); $("go").disabled = false; };
};
</script>
</body>
</html>
